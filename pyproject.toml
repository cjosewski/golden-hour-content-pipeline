[project]
name = "golden-hour-content-pipeline"
version = "0.1.0"
description = "RAG-based casualty-voice content pipeline for Golden Hour (ELVTR Multi-Agent AI for Game Development, Assignment #4)"
authors = [{ name = "Chad Josewski" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Pure-Python BM25 lexical retrieval — this is the RAG core; no vector DB,
    # no embedding service, no network dependency for retrieval.
    "rank-bm25>=0.2.2",
    # Native Anthropic provider — same family as Assignment #3 (crewai[anthropic]),
    # here used directly for the generator + critic role calls.
    "anthropic>=0.40",
    # Structured-output validation for every generated content item.
    "pydantic>=2",
]

# Non-package project: uv installs the locked dependency set into .venv but does
# not build/install this repo as a wheel. The pipeline runs as a module from the
# repo root (`uv run python -m pipeline ...`), so no build backend and no
# README-at-build-time requirement — the repo stays clone-and-run.
[tool.uv]
package = false
